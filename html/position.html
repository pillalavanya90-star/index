<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            width: 100px;
            height: 100px;
            background-color:rgb(203, 152, 250);
            position:fixed;
            top: 0px;
            left: 0px;
            border-radius: 45%;
        }
        .box2{
            width: 100px;
            height: 100px;
            background-color:rgb(225, 154, 154);
            position:fixed;
            top: 0px;
            right: 0px;
            border-radius: 45%;
        }
        .box3{
            width: 100px;
            height: 100px;
            background-color:rgb(154, 225, 154);
            position:fixed;
            bottom: 0px;
            left: 0px;
            border-radius: 45%;
        }
        .box4{
            width: 100px;
            height: 100px;
            background-color:rgb(154, 154, 225);
            position:fixed;
            bottom: 0px;
            right: 0px;
            border-radius: 45%;
        }
        
    </style>
</head>
<body>
   <div  class="box1">box1</div>
   <div class="box2">box2</div>
   <div class="box3">box3</div>
   <div class="box4">box4</div>
</body>
</html>
