<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ordered list</title>
</head>
<body>
    <ol>
    <li> html</li>
    <li>css</li>
    <li>java script</li>
    </ol> 
    <ul>
        <li> html</li>
        <li> css</li>
        <li> java script</li>
        </ul>
    </ul>
<dl>
    <dt> html</dt>
    <dd> html is a markup language</dd>
    <dt> css</dt>
    <dd> css is a style sheet language</dd>
</dl>
</body>
</html>
